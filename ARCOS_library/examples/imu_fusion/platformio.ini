;*****************************************************************
;   File:      platformio.ini
;   Category:  example configuration
;   Author:    XCR1793 (Feather Forge)
;  
;   Purpose:
;       Example showing IMU sensor fusion using the ARCOS library
;       with ICM20948 9-DOF sensor driver.
;*****************************************************************

[platformio]
default_envs = esp32s3-imu
description = ARCOS IMU Fusion Example

[env:esp32s3-imu]
platform = espressif32
board = esp32s3usbotg
framework = espidf
monitor_speed = 115200

lib_deps = 
    https://github.com/XCR1793/ARCOS.git#main

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT
    -DTARGET_ESP32_Wroom32S3_Module
    -std=c++17
    -DARCOS_IMU_EXAMPLE