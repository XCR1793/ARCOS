;*****************************************************************
;   File:      platformio.ini
;   Category:  example configuration
;   Author:    XCR1793 (Feather Forge)
;  
;   Purpose:
;       Minimal HAL example showing core hardware abstraction
;       without drivers or algorithms for smallest footprint.
;*****************************************************************

[platformio]
default_envs = esp32s3-minimal
description = ARCOS Minimal HAL Example

[env:esp32s3-minimal]
platform = espressif32
board = esp32s3usbotg
framework = espidf
monitor_speed = 115200

lib_deps = 
    https://github.com/XCR1793/ARCOS.git#main

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT
    -DTARGET_ESP32_Wroom32S3_Module
    -std=c++17
    -DARCOS_MINIMAL_EXAMPLE