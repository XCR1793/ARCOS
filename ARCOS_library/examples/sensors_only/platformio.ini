;*****************************************************************
;   File:      platformio.ini
;   Category:  example configuration
;   Author:    XCR1793 (Feather Forge)
;  
;   Purpose:
;       Sensors-only example showing modular inclusion of sensor
;       drivers and algorithms without display drivers.
;*****************************************************************

[platformio]
default_envs = esp32s3-sensors
description = ARCOS Sensors Only Example

[env:esp32s3-sensors]
platform = espressif32
board = esp32s3usbotg
framework = espidf
monitor_speed = 115200

lib_deps = 
    https://github.com/XCR1793/ARCOS.git#main

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT
    -DTARGET_ESP32_Wroom32S3_Module
    -std=c++17
    -DARCOS_SENSORS_EXAMPLE
    ; Add include path for library in subdirectory
    -I.pio/libdeps/$PIOENV/ARCOS/ARCOS_library/include