;*****************************************************************
;   File:      platformio.ini
;   Category:  example configuration
;   Author:    XCR1793 (Feather Forge)
;  
;   Purpose:
;       Example PlatformIO configuration showing how to include
;       the ARCOS library in your project via Git dependency.
;*****************************************************************

[platformio]
default_envs = esp32s3-example
description = ARCOS Library Basic Usage Example

[env:esp32s3-example]
platform = espressif32
board = esp32s3usbotg
framework = espidf
monitor_speed = 115200

; Include ARCOS library from GitHub
lib_deps = 
    https://github.com/XCR1793/ARCOS.git#main

; Required build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT
    -DTARGET_ESP32_Wroom32S3_Module
    -std=c++17
    ; Add include path for library in subdirectory
    -I.pio/libdeps/$PIOENV/ARCOS/ARCOS_library/include

; Optional: Enable debug logging
; build_flags =
;     -DARDUINO_USB_CDC_ON_BOOT
;     -DTARGET_ESP32_Wroom32S3_Module
;     -std=c++17
;     -DARCOS_DEBUG_ENABLED

[env:esp32s2-example]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
framework = espidf
monitor_speed = 115200

lib_deps = 
    https://github.com/XCR1793/ARCOS.git#main

build_flags = 
    -DTARGET_ESP32_Wroom32S2_Esp32Dev
    -std=c++17